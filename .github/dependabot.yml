version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, so a PR that bumps ESLint to 10 cannot install
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # DiceBear 10 moves styles to @dicebear/styles and always bundles a schema validator, which triples the avatar
      # code (about 11 kB to 33 kB gzipped) for no visible change. 9 is an LTS line, so the avatars stay on it.
      - dependency-name: '@dicebear/*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
